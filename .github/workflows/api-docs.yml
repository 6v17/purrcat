name: API Docs

on:
  push:
    branches: [main]
    paths:
      - "src/server/**"
      - "main.py"
      - "docs/server-api.md"
      - "scripts/check_api_docs.py"
      - ".github/workflows/api-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/server/**"
      - "main.py"
      - "docs/server-api.md"
      - "scripts/check_api_docs.py"
      - ".github/workflows/api-docs.yml"

jobs:
  api-docs-check:
    name: API Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify docs/server-api.md matches src/server routes
        run: python scripts/check_api_docs.py
